# Mirae continuous integration.
#
# Canonical documentation: docs/08-development/810-ci-cd-pipeline.md.
#
# Two rules shape this file:
#   - CI commands match local commands (810 invariant 10), so every step below is
#     a command a contributor can run unchanged;
#   - CI reads the same version files as a developer machine (.node-version,
#     package.json#packageManager, rust-toolchain.toml). No version is written
#     here, so a pin can never drift from DEPENDENCY_VERSIONS.md.
#
# Jobs from 810 section 2 that are not implemented yet, with their owning ticket:
#   - schema and codegen drift ................... MIR-0005, MIR-0006 register the
#     generators; `cargo xtask generate --check` already runs and reports that the
#     registry is empty, so the gate exists before there is anything to drift
#   - integration tests .......................... MIR-0015
#   - security parser and fuzz smoke ............. later sprints
#   - benchmark smoke ............................ later sprints
#   - macOS builds and packaging ................. later sprints
#
# Rust and documentation steps go through `cargo xtask` so CI cannot drift from
# the local command surface. The frontend steps stay as pnpm filters: splitting by
# language keeps the jobs parallel, while `cargo xtask check` remains the local
# one-shot that runs everything in sequence.
#
# The actions are intentionally pinned to @v4. Every job is annotated with a
# Node 20 deprecation warning, but @v5 of setup-node resolves
# package.json#packageManager before `corepack enable` runs and fails with
# "Unable to locate executable file: pnpm". Moving to @v5 requires installing
# pnpm before setup-node, or disabling its package-manager detection; that is a
# tooling ticket, not a blind version bump. Verified on run 30496018726.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never grant more than reading the repository; no job needs a token, and no job
# prints secrets (810 invariant 4).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    name: Toolchain pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Activates the pnpm version pinned by package.json#packageManager.
      - run: corepack enable

      # rustup reads rust-toolchain.toml and installs the pinned channel on the
      # first cargo invocation inside the repository.
      - run: cargo --version

      - run: cargo xtask bootstrap

      - run: cargo xtask docs --check

  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: cargo --version

      # Secrets, machine-local paths, committed environment files, dependency
      # direction, and npm pins. Needs no Node: the checks are pure Rust.
      - run: cargo xtask policy

      - run: cargo xtask generate --check

  format-and-lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - run: corepack enable

      # `cargo xtask fmt` and `lint` cover both languages, so this job installs
      # the frontend workspace to keep CI on the same command surface as a
      # developer machine (810 invariant 10).
      - run: pnpm install --frozen-lockfile

      - run: cargo xtask fmt --check

      - run: cargo xtask lint

  rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows-only failure must stay visible when Linux passes.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - run: cargo --version

      - run: cargo test --workspace

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - run: corepack enable

      # The root preinstall hook verifies the toolchain before anything is
      # fetched, and --frozen-lockfile fails if pnpm-lock.yaml is out of date.
      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm -r test

      - run: pnpm -r build
