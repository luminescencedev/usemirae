[workspace]
resolver = "3"
members = [
    "apps/desktop-shell",
    "apps/engine",
    "apps/extension-host",
    "crates/*/*",
    "tests/integration",
    "tools/xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

# Shared dependency versions are declared here so crates stay aligned.
# Every entry uses an exact requirement (`version = "=x.y.z"`), must be justified
# by its introducing ticket, and must be recorded in `DEPENDENCY_VERSIONS.md` §11.
[workspace.dependencies]
# Introduced by MIR-0012 for the control-plane wire format decided in ADR-0067.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# Introduced by MIR-0101 for the persisted entity identifier decided in
# ADR-0069. `v4` is the random generator; `serde` gives the canonical
# hyphenated text form in project files. Default features are off so no
# formatting, hashing, or clock backend is compiled in that nothing uses.
uuid = { version = "=1.24.0", default-features = false, features = [
    "std",
    "v4",
    "serde",
] }

# Introduced by MIR-0109 for the project integrity hash. ADR-0071 fixed the
# algorithm at SHA-256; this is the implementation. Default features are off so
# no assembly backend is compiled in, and `std` is on because the persistence
# path is not a no-std context.
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

# Introduced by MIR-0016 for the desktop window and system webview decided in
# ADR-0068. `wry` binds the operating system's own webview and `tao` owns the
# window and the event loop; neither bundles a browser engine. Default features
# are off so no clipboard, tray, file-dialog, or devtools surface is compiled in
# that `501` sections 3 and 4 have not asked for. `x11` stays on: dropping it
# would silently make the Linux build Wayland-only, and `504-linux-platform.md`
# supports both. The two versions are a matched pair: `wry 0.55` requires
# `tao 0.35`.
tao = { version = "=0.35.3", default-features = false, features = ["rwh_06"] }
wry = { version = "=0.55.1", default-features = false, features = [
    "protocol",
    "os-webview",
    "x11",
] }
