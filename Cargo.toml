[workspace]
resolver = "3"
members = [
    "apps/desktop-shell",
    "apps/engine",
    "apps/extension-host",
    "crates/*/*",
    "tools/xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

# Shared dependency versions are declared here so crates stay aligned.
# Every entry uses an exact requirement (`version = "=x.y.z"`), must be justified
# by its introducing ticket, and must be recorded in `DEPENDENCY_VERSIONS.md` §11.
[workspace.dependencies]
