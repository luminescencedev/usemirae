[package]
name = "mirae-shell"
description = "Native shell entry point and UI host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# An application assembles libraries and holds no domain logic (801 section 4).
# Supervision logic lives in mirae-runtime so it is testable without spawning
# processes; this crate provides the real launcher.
mirae-contracts = { path = "../../crates/foundation/contracts" }
mirae-commands = { path = "../../crates/domain/commands" }
mirae-platform = { path = "../../crates/platform/platform" }
mirae-project = { path = "../../crates/project/project" }
mirae-runtime = { path = "../../crates/runtime/runtime" }
mirae-state = { path = "../../crates/domain/state" }
mirae-types = { path = "../../crates/foundation/types" }
serde_json = { workspace = true }

# The window and the system webview (ADR-0068). They stay in this application
# crate: no library may depend on an operating-system SDK (804 section 3), and
# nothing outside the shell hosts a window.
tao = { workspace = true }
wry = { workspace = true }

[lints]
workspace = true
